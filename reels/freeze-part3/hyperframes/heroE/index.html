<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      :root { --ink:#f2efe8; --mute:#8a8f8c; --card:#151818; --line:#2a2f2f; --cyan:#5ac8fa; --green:#3be58f; --red:#ff5a47;
        --font-display:"Inter",sans-serif; --font-mono:"JetBrains Mono",monospace; }
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1080px; height:1920px; overflow:hidden; background:transparent; }
      #root { position:absolute; inset:0; font-family:var(--font-display); color:var(--ink); }
      #stage, #inner { position:absolute; inset:0; }
      .a { position:absolute; }
      .mono { font-family:var(--font-mono); font-weight:800; letter-spacing:.12em; }
      .card { position:absolute; border-radius:24px; background:var(--card); border:2px solid var(--line); box-shadow:0 26px 50px rgba(0,0,0,.5); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.76" data-width="1080" data-height="1920">
      <div id="stage" class="clip" data-start="0" data-duration="3.76" data-track-index="0" data-layout-allow-overlap>
        <div id="inner">

          <div class="card" id="prof" style="left:240px;top:420px;width:600px;height:560px;overflow:hidden">
            <div class="a" style="left:40px;top:40px;width:120px;height:120px;border-radius:50%;background:#2a2f2f;display:flex;align-items:center;justify-content:center">
              <svg viewBox="0 0 40 52" width="70" height="90"><circle cx="20" cy="12" r="10" fill="#8a8f8c"/><path d="M2 52 Q2 26 20 26 Q38 26 38 52Z" fill="#8a8f8c"/></svg></div>
            <div class="a mono" style="left:190px;top:56px;font-size:22px;color:var(--mute)">P2P BUYER</div>
            <div class="a" style="left:190px;top:92px;font-weight:900;font-size:50px">user_7x2k</div>
            <div class="a" style="left:40px;top:210px;width:520px">
              <div style="height:18px;width:420px;border-radius:9px;background:#2a2f2f"></div><div style="margin-top:22px;height:18px;width:340px;border-radius:9px;background:#2a2f2f"></div>
              <div style="margin-top:22px;height:18px;width:460px;border-radius:9px;background:#2a2f2f"></div></div>
            <div class="a" id="verdict" style="left:40px;top:400px;width:520px;height:110px;border-radius:18px;border:4px solid var(--mute);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:56px"><span id="vq" style="color:var(--mute)">SAFE ?</span></div>
            <div class="a" id="beam" style="left:0;top:0;width:600px;height:14px;background:var(--cyan);box-shadow:0 0 40px 10px rgba(90,200,250,.6)"></div>
          </div>
          <div class="a" id="flags" style="left:0;right:0;top:1030px;display:flex;justify-content:center;gap:26px">
            <div class="fl" style="width:110px;height:110px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:56px">1</div>
            <div class="fl" style="width:110px;height:110px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:56px">2</div>
            <div class="fl" style="width:110px;height:110px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:56px">3</div>
            <div class="fl" style="width:110px;height:110px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:56px">4</div>
            <div class="fl" style="width:110px;height:110px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:56px">5</div>
          </div>
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#prof", { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0);
      tl.fromTo("#beam", { y: 0 }, { y: 540, duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.3);
      tl.fromTo("#vq", { opacity: 1 }, { opacity: 0.35, duration: 0.15, yoyo: true, repeat: 5 }, 0.5);
      tl.to("#verdict", { borderColor: "#ff5a47", duration: 0.2 }, 1.3);
      tl.fromTo(".fl", { scale: 0, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.3, stagger: 0.14, ease: "back.out(2.6)" }, 2.25);
      tl.to("#inner", { opacity: 0, duration: 0.18 }, 3.54);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
