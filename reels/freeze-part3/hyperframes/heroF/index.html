<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      :root { --ink:#f2efe8; --mute:#8a8f8c; --card:#151818; --line:#2a2f2f; --cyan:#5ac8fa; --green:#3be58f; --red:#ff5a47;
        --font-display:"Inter",sans-serif; --font-mono:"JetBrains Mono",monospace; }
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1080px; height:1920px; overflow:hidden; background:transparent; }
      #root { position:absolute; inset:0; font-family:var(--font-display); color:var(--ink); }
      #stage, #inner { position:absolute; inset:0; }
      .a { position:absolute; }
      .mono { font-family:var(--font-mono); font-weight:800; letter-spacing:.12em; }
      .card { position:absolute; border-radius:24px; background:var(--card); border:2px solid var(--line); box-shadow:0 26px 50px rgba(0,0,0,.5); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.45" data-width="1080" data-height="1920">
      <div id="stage" class="clip" data-start="0" data-duration="5.45" data-track-index="0" data-layout-allow-overlap>
        <div id="inner">

          <div class="a" id="big" style="left:0;right:0;top:560px;text-align:center;font-weight:900;font-size:150px;letter-spacing:-.03em">Red flag <span style="color:var(--red)">1</span></div>
          <div class="card" id="c1" style="left:90px;top:420px;width:900px;height:200px;padding:30px 36px">
            <div class="mono" style="font-size:22px;color:var(--mute)">P2P ORDER · TRADE NAAM</div>
            <div style="font-weight:900;font-size:64px;margin-top:10px">RAHUL <span id="n1">SHARMA</span></div>
          </div>
          <div class="card" id="c2" style="left:90px;top:760px;width:900px;height:200px;padding:30px 36px">
            <div class="mono" style="font-size:22px;color:var(--mute)">UPI · PAISA AAYA · ACCOUNT NAAM</div>
            <div style="font-weight:900;font-size:64px;margin-top:10px;color:#ff8a7a">SUNITA DEVI</div>
          </div>
          <div class="a" id="vs" style="left:470px;top:640px;width:140px;height:100px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:80px;color:var(--red)">≠</div>
          <div class="a" id="st" style="left:300px;top:1000px;padding:12px 30px 6px;border:8px solid var(--red);border-radius:14px;color:var(--red);font-weight:900;font-size:64px">NAAM MISMATCH</div>
          <div class="a mono" id="ex" style="left:0;right:0;top:1120px;text-align:center;font-size:20px;color:var(--mute)">EXAMPLE NAMES</div>
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#big", { scale: 2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "power4.in" }, 0.0);
      tl.to("#big", { y: -300, opacity: 0, duration: 0.3, ease: "power2.in" }, 0.85);
      tl.fromTo("#c1", { x: -1000 }, { x: 0, duration: 0.4, ease: "power3.out" }, 1.0);
      tl.fromTo("#c2", { x: 1000 }, { x: 0, duration: 0.4, ease: "power3.out" }, 2.3);
      tl.fromTo("#ex", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 2.6);
      tl.fromTo("#vs", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(3)" }, 3.6);
      tl.to("#c2", { borderColor: "#ff5a47", duration: 0.2 }, 3.6);
      tl.fromTo("#st", { scale: 2.4, opacity: 0, rotation: -15 }, { scale: 1, opacity: 1, rotation: -5, duration: 0.2, ease: "power4.in" }, 4.4);
      tl.to(["#c1", "#c2"], { x: 10, duration: 0.05, yoyo: true, repeat: 5, ease: "none" }, 4.6);
      tl.to("#inner", { opacity: 0, duration: 0.18 }, 5.23);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
