<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:IT;font-weight:700;src:url(fonts/inter-tight-latin-700-normal.woff2)}
@font-face{font-family:IT;font-weight:800;src:url(fonts/inter-tight-latin-800-normal.woff2)}
@font-face{font-family:IT;font-weight:900;src:url(fonts/inter-tight-latin-900-normal.woff2)}
@font-face{font-family:JB;font-weight:700;src:url(fonts/jetbrains-mono-latin-700-normal.woff2)}
:root{--ink:#16171a;--paper:#ece7dc;--yel:#FDC43F;--red:#FF5A47;--vio:#7C5CFF;--bg:#0d0e0f}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:var(--bg);overflow:hidden}
body{position:relative;font-family:IT,sans-serif}
.abs{position:absolute}
.grain{inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.55}
.glow{left:90px;top:620px;width:900px;height:900px;border-radius:50%;
  background:radial-gradient(circle,rgba(90,200,250,.22) 0%,rgba(90,200,250,.08) 40%,transparent 68%)}
/* paper note */
.note{left:96px;top:140px;width:888px;height:560px;transform:rotate(-2.2deg);
  background:var(--paper);box-shadow:0 30px 60px rgba(0,0,0,.55),0 4px 10px rgba(0,0,0,.4);
  clip-path:polygon(0 0,100% 0,100% 93%,96% 95%,91% 93.5%,86% 96%,80% 94%,73% 96.5%,66% 94.5%,58% 97%,50% 95%,43% 97.5%,35% 95%,27% 97%,20% 94.5%,13% 96.5%,6% 94%,0 96%)}
.note .tex{inset:0;opacity:.5;mix-blend-mode:multiply}
.h1{left:58px;top:40px;font-weight:900;font-size:206px;line-height:.86;letter-spacing:-.045em;color:var(--ink)}
.h1 .hl{position:relative;display:inline-block;z-index:1}
.h1 .hl svg{position:absolute;left:-18px;top:30px;width:118%;height:78%;z-index:-1}
.h3{left:62px;top:400px;font-weight:900;font-size:64px;letter-spacing:-.03em;color:var(--ink)}
.h3 .zero{position:relative;color:#5AC8FA;margin:0 24px}
.h3 .zero svg{position:absolute;left:-24px;top:-16px;width:calc(100% + 48px);height:118px}
.ast{right:42px;top:22px;font-weight:900;font-size:110px;line-height:1;color:var(--ink)}
.pin{left:420px;top:112px;width:46px;height:46px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ffe9a8,#e0a923 45%,#8a6110 100%);
  box-shadow:6px 10px 12px rgba(0,0,0,.5);transform:rotate(-2deg)}
/* avatar */
.avatar{left:-30px;top:690px;width:1190px}
/* annotations */
.ann{color:#f4f1ea;font-weight:800;text-transform:uppercase;letter-spacing:-.01em;line-height:.95}
.ann .big{font-size:76px;font-weight:900;display:block}
.ann .sm{font-size:44px;display:block}
.ann svg{display:block;margin-top:8px}
.doc{left:50px;top:1080px;width:170px;height:214px;background:#f4f1ea;transform:rotate(-6deg);
  clip-path:polygon(0 0,74% 0,100% 20%,100% 100%,0 100%);box-shadow:0 18px 30px rgba(0,0,0,.5)}
.doc i{position:absolute;left:22px;height:9px;border-radius:5px;background:#c9c3b6}
.doc b{position:absolute;left:46px;top:104px;width:78px;height:78px;border-radius:50%;background:#5AC8FA;
  font:900 52px/78px IT;text-align:center;color:var(--ink)}
.nolaw{left:838px;top:1090px;width:230px;height:176px;color:var(--red);font-weight:900;font-size:46px;
  line-height:.9;text-align:center;padding-top:36px;transform:rotate(-7deg)}
.nolaw svg{position:absolute;inset:0}
.arrow{left:950px;top:975px}
/* bottom */
.fade{left:0;right:0;bottom:0;height:520px;background:linear-gradient(to bottom,transparent,rgba(13,14,15,.55) 45%,rgba(13,14,15,.85))}
.title{left:0;right:0;top:1540px;text-align:center;color:#fff;font-weight:900;font-size:54px;letter-spacing:-.03em;text-shadow:0 4px 18px rgba(0,0,0,.6)}
.brush{left:170px;top:1612px}
.ep{left:50%;top:1666px;transform:translateX(-50%);background:#5AC8FA;color:var(--ink);
  font:700 40px/1 JB;letter-spacing:.06em;padding:12px 34px;border-radius:40px}
.handle{left:0;right:0;top:1742px;text-align:center;color:#a7a39b;font:700 30px JB}
.handle:before{content:"";display:inline-block;width:16px;height:16px;background:var(--vio);margin-right:12px;vertical-align:2px}
.torn{left:0;bottom:0;width:1080px;height:96px}
</style></head>
