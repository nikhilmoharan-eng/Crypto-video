<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      :root { --ink:#f2efe8; --mute:#8a8f8c; --card:#151818; --line:#2a2f2f; --cyan:#5ac8fa; --green:#3be58f; --red:#ff5a47; --orange:#ff9f2e;
        --font-display:"Inter",sans-serif; --font-mono:"JetBrains Mono",monospace; }
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1080px; height:1920px; overflow:hidden; background:transparent; }
      #root { position:absolute; inset:0; font-family:var(--font-display); color:var(--ink); }
      #stage, #inner { position:absolute; inset:0; }
      .a { position:absolute; }
      .mono { font-family:var(--font-mono); font-weight:800; letter-spacing:.12em; }
      .card { position:absolute; border-radius:24px; background:var(--card); border:2px solid var(--line); box-shadow:0 26px 50px rgba(0,0,0,.5); }
      .node { position:absolute; width:250px; height:250px; border-radius:30px; background:var(--card); border:3px solid var(--line); display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:0 26px 50px rgba(0,0,0,.5); }
      .node .ic { width:110px; height:110px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:60px; color:#0b0d0e; }
      .node .t { font-weight:900; font-size:36px; margin-top:16px; }
      .node .s { font-family:var(--font-mono); font-weight:800; font-size:18px; letter-spacing:.1em; color:var(--mute); margin-top:4px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.3" data-width="1080" data-height="1920">
      <div id="stage" class="clip" data-start="0" data-duration="4.3" data-track-index="0" data-layout-allow-overlap>
        <div id="inner">

          <div class="a" id="ice" style="left:240px;top:420px;width:600px;height:600px;border-radius:50%;background:radial-gradient(closest-side,rgba(170,220,245,.45),transparent 70%)"></div>
          <div class="a" id="lock" style="left:440px;top:560px;width:200px;height:200px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;box-shadow:0 0 60px rgba(255,90,71,.5)">
            <svg viewBox="0 0 24 24" width="110" height="110"><rect x="5" y="10" width="14" height="10" rx="2" fill="#fff"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="#fff" stroke-width="2.6" fill="none"/></svg></div>
          <div class="a" id="q" style="left:620px;top:500px;font-weight:900;font-size:120px;color:var(--red)">?</div>
          <div class="node" id="cr" style="left:80px;top:540px"><div class="ic" style="background:var(--orange)">₿</div><div class="t">Crypto</div></div>
          <div class="node" id="rs" style="left:750px;top:540px;border-color:var(--green)"><div class="ic" style="background:var(--green)">₹</div><div class="t">Rupaye</div></div>
          <svg class="a" style="left:0;top:0" width="1080" height="1920"><path id="path" d="M330 665 H750" stroke="#3be58f" stroke-width="10" stroke-dasharray="420" stroke-dashoffset="420" stroke-linecap="round"/></svg>
          <div class="a" id="sh" style="left:470px;top:595px;width:140px;height:140px;border-radius:50%;background:#0b0d0e;border:6px solid var(--green);display:flex;align-items:center;justify-content:center">
            <svg viewBox="0 0 24 24" width="80" height="80"><path d="M12 2l8 3v6c0 5-3.4 9.3-8 11-4.6-1.7-8-6-8-11V5z" fill="#3be58f"/><path d="M8.5 12l2.5 2.5 4.5-5" stroke="#0b0d0e" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg></div>
          <div class="a" id="lab" style="left:0;right:0;top:880px;text-align:center"><span style="display:inline-block;padding:14px 30px;border-radius:16px;border:5px solid var(--green);color:var(--green);font-weight:900;font-size:52px">SAFE TAREEKA</span></div>
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#ice", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4 }, 0);
      tl.fromTo("#lock", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2.5)" }, 0.05);
      tl.fromTo("#q", { scale: 0, rotation: -30 }, { scale: 1, rotation: 10, duration: 0.3, ease: "back.out(3)" }, 0.35);
      tl.to(["#lock", "#q", "#ice"], { scale: 0, opacity: 0, duration: 0.25, ease: "power2.in" }, 1.0);
      tl.fromTo("#cr", { x: -500, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 1.15);
      tl.fromTo("#rs", { x: 500, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 1.55);
      tl.to("#path", { attr: { "stroke-dashoffset": 0 }, duration: 0.6, ease: "power2.out" }, 2.7);
      tl.fromTo("#sh", { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(2.5)" }, 2.9);
      tl.fromTo("#lab", { scale: 2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.22, ease: "power4.in" }, 3.1);
      tl.to("#inner", { opacity: 0, duration: 0.18 }, 4.08);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
