<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      :root { --ink:#f2efe8; --mute:#8a8f8c; --card:#151818; --line:#2a2f2f; --cyan:#5ac8fa; --green:#3be58f; --red:#ff5a47; --orange:#ff9f2e;
        --font-display:"Inter",sans-serif; --font-mono:"JetBrains Mono",monospace; }
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1080px; height:1920px; overflow:hidden; background:transparent; }
      #root { position:absolute; inset:0; font-family:var(--font-display); color:var(--ink); }
      #stage, #inner { position:absolute; inset:0; }
      .a { position:absolute; }
      .mono { font-family:var(--font-mono); font-weight:800; letter-spacing:.12em; }
      .card { position:absolute; border-radius:24px; background:var(--card); border:2px solid var(--line); box-shadow:0 26px 50px rgba(0,0,0,.5); }
      .node { position:absolute; width:250px; height:250px; border-radius:30px; background:var(--card); border:3px solid var(--line); display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:0 26px 50px rgba(0,0,0,.5); }
      .node .ic { width:110px; height:110px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:60px; color:#0b0d0e; }
      .node .t { font-weight:900; font-size:36px; margin-top:16px; }
      .node .s { font-family:var(--font-mono); font-weight:800; font-size:18px; letter-spacing:.1em; color:var(--mute); margin-top:4px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9.01" data-width="1080" data-height="1920">
      <div id="stage" class="clip" data-start="0" data-duration="9.01" data-track-index="0" data-layout-allow-overlap>
        <div id="inner">

          <div class="a" id="big" style="left:0;right:0;top:560px;text-align:center;font-weight:900;font-size:130px;letter-spacing:-.03em;color:var(--green)">Sabse safe</div>
          <div class="node" id="you" style="left:80px;top:400px"><div class="ic" style="background:var(--orange)">₿</div><div class="t">Aap</div><div class="s">CRYPTO BECHO</div></div>
          <div class="node" id="ex" style="left:415px;top:400px;border-color:var(--cyan)"><div class="ic" style="background:var(--cyan)">⇄</div><div class="t">Exchange</div><div class="s">INR WITHDRAWAL</div></div>
          <div class="node" id="bk" style="left:750px;top:400px;border-color:var(--green)"><div class="ic" style="background:var(--green)">₹</div><div class="t">Aapka bank</div><div class="s">SEEDHA</div></div>
          <svg class="a" style="left:0;top:0" width="1080" height="1920">
            <path id="l1" d="M330 525 H415" stroke="#5ac8fa" stroke-width="10" stroke-dasharray="85" stroke-dashoffset="85"/>
            <path id="l2" d="M665 525 H750" stroke="#3be58f" stroke-width="10" stroke-dasharray="85" stroke-dashoffset="85"/>
          </svg>
          <div class="a" id="coin" style="left:0;top:0;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:var(--orange);color:#0b0d0e;font-weight:900;font-size:34px;display:flex;align-items:center;justify-content:center">₿</div>
          <div class="a" id="cash" style="left:0;top:0;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:var(--green);color:#0b0d0e;font-weight:900;font-size:34px;display:flex;align-items:center;justify-content:center">₹</div>
          <div class="card" id="str" style="left:240px;top:740px;width:600px;height:200px;padding:28px;border-color:var(--red)">
            <div class="mono" style="font-size:20px;color:var(--mute)">ANJAAN INSAAN · P2P</div>
            <div style="font-weight:900;font-size:50px;margin-top:10px">₹ kisi aur se?</div>
            <svg class="a" style="left:0;top:0" width="600" height="200"><path id="x1" d="M30 30 L570 170 M570 30 L30 170" stroke="#ff5a47" stroke-width="12" stroke-linecap="round" stroke-dasharray="1150" stroke-dashoffset="1150"/></svg></div>
          <div class="a" id="ok" style="left:0;right:0;top:980px;text-align:center"><span style="display:inline-block;padding:14px 30px;border-radius:16px;border:5px solid var(--green);color:var(--green);font-weight:900;font-size:46px">FREEZE RISK KAM ✓</span></div>
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#big", { scale: 2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.22, ease: "power4.in" }, 0.0);
      tl.to("#big", { y: -300, opacity: 0, duration: 0.3, ease: "power2.in" }, 0.75);
      tl.fromTo("#ex", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2)" }, 1.0);
      tl.fromTo("#you", { x: -400, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 3.15);
      tl.to("#l1", { attr: { "stroke-dashoffset": 0 }, duration: 0.3 }, 3.7);
      tl.fromTo("#coin", { x: 205, y: 525, opacity: 0 }, { x: 205, y: 525, opacity: 1, duration: 0.1 }, 3.8);
      tl.to("#coin", { x: 540, duration: 0.5, ease: "power1.inOut" }, 3.9);
      tl.to("#coin", { opacity: 0, scale: 0.4, duration: 0.15 }, 4.4);
      tl.fromTo("#bk", { x: 400, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 4.8);
      tl.to("#l2", { attr: { "stroke-dashoffset": 0 }, duration: 0.3 }, 5.2);
      tl.fromTo("#cash", { x: 540, y: 525, opacity: 0, scale: 0.4 }, { x: 540, y: 525, opacity: 1, scale: 1, duration: 0.15 }, 5.4);
      tl.to("#cash", { x: 875, duration: 0.55, ease: "power1.inOut" }, 5.55);
      tl.to("#bk", { scale: 1.08, duration: 0.15, yoyo: true, repeat: 1 }, 6.1);
      tl.to("#cash", { opacity: 0, scale: 0.4, duration: 0.15 }, 6.1);
      tl.fromTo("#str", { y: 300, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 7.35);
      tl.to("#x1", { attr: { "stroke-dashoffset": 0 }, duration: 0.35, ease: "power2.out" }, 7.75);
      tl.fromTo("#ok", { scale: 2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.22, ease: "power4.in" }, 8.2);
      tl.to("#inner", { opacity: 0, duration: 0.18 }, 8.79);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
