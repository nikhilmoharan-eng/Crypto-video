<!doctype html>
<html lang="en">
  <head>

    <style>

      .tag { position:absolute; padding:16px 26px; border-radius:18px; background:var(--card); border:3px solid var(--cyan); font-weight:900; font-size:40px;

    </style>
  </head>

          </div>

      </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      // local = engine - 26.47
      tl.fromTo("#big", { scale: 2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "power4.in" }, 0.0);
      tl.to("#big", { y: -380, scale: 0.55, opacity: 0, duration: 0.35, ease: "power2.in" }, 0.85);
      tl.fromTo("#folder", { y: 500, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.95);

      tl.fromTo("#d2", { y: -700, rotation: 20, opacity: 0 }, { y: 0, rotation: 2, opacity: 1, duration: 0.45, ease: "power3.out" }, 3.55);
      tl.fromTo("#d3", { x: 600, rotation: 25, opacity: 0 }, { x: 0, rotation: 7, opacity: 1, duration: 0.45, ease: "power3.out" }, 4.76);
      tl.fromTo("#note", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 2.6);
      tl.to(["#d1", "#d2", "#d3"], { y: 330, scale: 0.8, duration: 0.35, stagger: 0.05, ease: "power2.in" }, 5.3);
      tl.to("#flap", { rotationX: 0, duration: 0.3 }, 5.55);
      tl.fromTo("#ready", { scale: 2.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.22, ease: "power4.in" }, 5.6);
      tl.to("#inner", { opacity: 0, duration: 0.18 }, 6.0);
      window.__timelines["main"] = tl;

  </body>
</html>
