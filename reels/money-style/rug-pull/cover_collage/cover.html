.note .v{font-weight:900;font-size:64px;color:#2f4f2c}

 background:linear-gradient(110deg,#b9f3ff,#c7b8ff 30%,#ffd1f0 50%,#b8ffd8 70%,#9fd3ff);border:4px solid #fff;display:flex;align-items:center;justify-content:center;
 font-weight:900;font-size:44px;letter-spacing:-.02em;color:#0B1F4A}
.tag{left:330px;top:1395px;transform:rotate(8deg);background:#F4C84A;border:4px solid #fff;border-radius:12px;padding:10px 20px;font-weight:900;font-size:40px;color:#111}

.menu div:last-child{border:none}
.menu:after{content:"";position:absolute;left:40px;bottom:-14px;border:14px solid transparent;border-top-color:#1c1c1e;border-bottom:0}
/* pin */
.pin{right:-40px;top:1500px;transform:rotate(-30deg)}
.handle{left:0;right:0;top:1846px;text-shadow:0 2px 10px rgba(4,14,38,.6);text-align:center;font-weight:800;font-size:30px;color:rgba(234,243,255,.9)}

.pd{background:#0B1F4A;color:#fff}.pd i{display:inline-block;width:13px;height:13px;border-radius:4px;background:#22D37A;margin-right:10px;vertical-align:2px}
