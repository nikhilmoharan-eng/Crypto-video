<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:IN;font-weight:400;src:url(inter-latin-400-normal.woff2)}
@font-face{font-family:IN;font-weight:700;src:url(inter-latin-700-normal.woff2)}
@font-face{font-family:IN;font-weight:800;src:url(inter-latin-800-normal.woff2)}
@font-face{font-family:IN;font-weight:900;src:url(inter-latin-900-normal.woff2)}
@font-face{font-family:SG;font-weight:400;src:url(space-grotesk-latin-400-normal.woff2)}
@font-face{font-family:SG;font-weight:500;src:url(space-grotesk-latin-500-normal.woff2)}
@font-face{font-family:SG;font-weight:600;src:url(space-grotesk-latin-600-normal.woff2)}
@font-face{font-family:SG;font-weight:700;src:url(space-grotesk-latin-700-normal.woff2)}
@font-face{font-family:SM;font-weight:400;src:url(space-mono-latin-400-normal.woff2)}
@font-face{font-family:SM;font-weight:700;src:url(space-mono-latin-700-normal.woff2)}
:root{--bg:#120917;--bg2:#1B0F22;--ivory:#FFFFFF;--mute:#A99BB3;--gold:#C858C6;--gold2:#E7B6FF;--vio:#9D14FF;--emer:#C858C6;--ruby:#670707;--line:rgba(200,88,198,.16)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#06040A}
body{position:relative;font-family:SG,sans-serif;color:var(--ivory)}
.a{position:absolute}
.glow{inset:0;background:linear-gradient(180deg,#06040A 0%,#0B0610 28%,#1E0B2C 50%,#4A1670 72%,#8E1EC8 92%,#9D14FF 100%),radial-gradient(900px 900px at 100% 85%,rgba(200,88,198,.55),transparent 65%)}
.grid{left:110px;right:110px;top:560px;height:900px;opacity:.7;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:60px 60px;
 -webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%)}
.vig{inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.55))}
.grain{inset:0;opacity:.07;mix-blend-mode:overlay}
.handle{left:0;right:0;top:250px;text-align:center;font-weight:500;font-size:30px;color:rgba(255,255,255,.5);letter-spacing:.02em}
.handle b{color:var(--gold);font-weight:700}
.cap{left:60px;right:60px;top:320px;text-align:center}
.l1{font-family:SG;font-weight:400;font-size:52px;color:rgba(243,238,227,.85)}
.l2{font-weight:600;font-size:110px;letter-spacing:-.04em;line-height:1.02;margin-top:6px}
.l3{font-weight:700;font-size:110px;letter-spacing:-.04em;line-height:1.02;background:linear-gradient(90deg,#E7B6FF,#C858C6 45%,#9D14FF);-webkit-background-clip:text;color:transparent}
.box{display:inline-block;background:var(--ivory);color:var(--bg);padding:0 18px 6px;font-weight:900;font-size:64px;letter-spacing:-.02em;margin-top:14px}
/* receipt card */
.card{left:250px;top:820px;width:580px;border-radius:30px;background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.04));backdrop-filter:blur(24px);border:1.5px solid rgba(255,255,255,.22);
 box-shadow:0 40px 90px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);padding:36px 40px}
.ch{display:flex;align-items:center;gap:18px}
.coin{width:74px;height:74px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#E7B6FF,#9D14FF 60%,#4A0A80);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:42px}
.t{font-weight:800;font-size:38px}.s{font-family:SM;font-size:20px;color:var(--mute);letter-spacing:.12em;margin-top:2px}
.scr{margin-top:28px;border-radius:18px;background:#120917;border:1px solid rgba(255,255,255,.06);padding:22px 26px}
.sl{font-family:SM;font-size:18px;color:var(--mute);letter-spacing:.14em}
.sv{font-family:SM;font-weight:700;font-size:64px;white-space:nowrap;color:var(--gold);text-align:right;margin-top:8px;text-shadow:0 0 34px rgba(200,88,198,.55)}
.row{display:flex;justify-content:space-between;font-family:SM;font-size:26px;margin-top:22px;color:rgba(243,238,227,.85)}
.row.k{color:#E7B6FF;font-weight:700;border-top:1px dashed rgba(255,255,255,.15);padding-top:20px}
.stamp{left:600px;top:770px;transform:rotate(-8deg);font-family:SM;font-weight:700;font-size:34px;letter-spacing:.12em;color:var(--gold);border:4px solid var(--gold);border-radius:40px;padding:8px 26px;background:rgba(18,9,23,.75)}
.pills{left:0;right:0;top:1520px;display:flex;justify-content:center;gap:14px}
.pill{padding:14px 28px;border-radius:40px;font-weight:500;font-size:28px;border:1.5px solid rgba(255,255,255,.3);color:#fff;background:rgba(255,255,255,.08);backdrop-filter:blur(12px)}
.sw{left:0;right:0;top:1640px;display:flex;justify-content:center;gap:18px}
.sw div{width:90px;height:90px;border-radius:50%;border:2px solid rgba(255,255,255,.3)}
.swl{left:0;right:0;top:1750px;text-align:center;font-family:SM;font-size:20px;color:var(--mute);letter-spacing:.14em}
</style></head><body>
<div class="a glow"></div><div class="a grid"></div>
<svg class="a grain" width="1080" height="1920"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency="1" numOctaves="2"/><feColorMatrix type="saturate" values="0"/></filter><rect width="1080" height="1920" filter="url(#g)"/></svg>
<div class="a vig"></div>
<div class="a handle">niks<b>.crypto</b></div>
<div class="a cap"><div class="l1">22 May 2010. Ek aadmi ne</div><div class="l2">2 pizza</div><div class="l1" style="margin-top:4px">ke liye diye</div><div class="l3">10,000 BTC.</div></div>
<div class="a card"><div class="ch"><div class="coin">₿</div><div><div class="t">Pizza Order</div><div class="s">FLORIDA · 22 MAY 2010</div></div></div>
 <div class="scr"><div class="sl">PAID IN BITCOIN</div><div class="sv">10,000 BTC</div></div>
 <div class="row"><span>2 × LARGE PIZZA</span><span>~$41</span></div>
 <div class="row k"><span>VALUE TODAY</span><span>₹ HAZAARON CR</span></div></div>
<div class="a stamp">PAID IN BTC</div>
<div class="a pills"><div class="pill">Crypto Stories</div><div class="pill">EP 01 · Pizza Day</div></div>
<div class="a sw"><div style="background:#9D14FF"></div><div style="background:#C858C6"></div><div style="background:#670707"></div><div style="background:#120917"></div><div style="background:#FFFFFF"></div></div>
<div class="a swl">#9D14FF · #C858C6 · #670707 · #120917 · #FFFFFF · SPACE GROTESK</div>
</body></html>
