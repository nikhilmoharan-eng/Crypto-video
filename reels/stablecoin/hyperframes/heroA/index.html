<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      :root { --ink:#f2efe8; --mute:#8a8f8c; --card:#151818; --line:#2a2f2f; --green:#3be58f; --red:#ff5a47; --orange:#ff9f2e;
        --font-display:"Inter",sans-serif; --font-mono:"JetBrains Mono",monospace; }
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1080px; height:1920px; overflow:hidden; background:transparent; }
      #root { position:absolute; inset:0; font-family:var(--font-display); color:var(--ink); }
      #stage, #inner { position:absolute; inset:0; }
      .card { position:absolute; left:90px; width:900px; border-radius:26px; background:var(--card); border:2px solid var(--line);
        box-shadow:0 30px 60px rgba(0,0,0,.5); overflow:hidden; }
      .lab { position:absolute; left:28px; top:22px; font:800 22px var(--font-mono); letter-spacing:.12em; color:var(--mute); }
      .big { position:absolute; right:28px; top:14px; font-weight:900; font-size:48px; letter-spacing:-.02em; }
      .chart { position:absolute; left:30px; top:80px; }
      .pill { position:absolute; border-radius:40px; font-weight:900; letter-spacing:-.02em; box-shadow:0 16px 36px rgba(0,0,0,.45); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.76" data-width="1080" data-height="1920">
      <div id="stage" class="clip" data-start="0" data-duration="5.76" data-track-index="0" data-layout-allow-overlap>
        <div id="inner">
          <div class="card" id="btc" style="top:395px;height:300px">
            <div class="lab">BITCOIN · 30 DIN · EXAMPLE</div><div class="big" id="btcpct" style="color:var(--orange)">±18%</div>
            <svg class="chart" width="840" height="200" viewBox="0 0 840 200">
              <polyline id="btcl" points="0,120 40,90 80,140 120,70 160,110 200,40 240,95 280,60 320,150 360,100 400,170 440,80 480,120 520,30 560,90 600,60 640,140 680,100 720,160 760,70 800,110 840,50"
                fill="none" stroke="#ff9f2e" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="card" id="usdt" style="top:730px;height:300px">
            <div class="lab">USDT · 30 DIN</div><div class="big" style="color:var(--green)">$1.00</div>
            <svg class="chart" width="840" height="200" viewBox="0 0 840 200">
              <line x1="0" y1="100" x2="840" y2="100" stroke="#3be58f" stroke-opacity=".35" stroke-width="3" stroke-dasharray="10 12"/>
              <polyline id="usdtl" points="0,100 70,98 140,101 210,99 280,100 350,102 420,99 490,100 560,101 630,99 700,100 770,101 840,100"
                fill="none" stroke="#3be58f" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="pill" id="peg" style="left:700px;top:668px;padding:12px 26px;background:var(--green);color:#0b0d0e;font-size:40px">≈ $1 FIXED</div>
          <div class="pill" id="q" style="left:440px;top:590px;width:200px;height:200px;border-radius:50%;background:#16171a;border:4px solid var(--green);
            color:var(--green);font-size:130px;line-height:190px;text-align:center" data-layout-allow-occlusion>?</div>
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // local = engine - 0.35
      tl.fromTo("#btc", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0);
      tl.fromTo("#btcl", { attr: { "stroke-dasharray": "4000", "stroke-dashoffset": 4000 } }, { attr: { "stroke-dashoffset": 0 }, duration: 1.6, ease: "none" }, 0.15);
      tl.fromTo("#btcpct", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)" }, 1.2);
      tl.fromTo("#usdt", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 2.15);
      tl.fromTo("#usdtl", { attr: { "stroke-dasharray": "1000", "stroke-dashoffset": 1000 } }, { attr: { "stroke-dashoffset": 0 }, duration: 1.2, ease: "none" }, 2.35);
      tl.fromTo("#peg", { scale: 0, rotation: -12 }, { scale: 1, rotation: -4, duration: 0.4, ease: "back.out(2.4)" }, 3.95);
      tl.fromTo("#q", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2.2)" }, 4.6);
      tl.to("#q", { rotation: 12, duration: 0.12, yoyo: true, repeat: 3 }, 4.95);
      tl.to("#inner", { opacity: 0, duration: 0.2 }, 5.5);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
