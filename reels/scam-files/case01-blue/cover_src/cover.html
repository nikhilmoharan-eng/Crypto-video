:root{--paper:#EAF3FF;--red:#2F6FD8;--ink:#0B1F4A;--amber:#7CC0FF}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper)}
body{position:relative;font-family:IN,sans-serif;color:var(--ink)}
.a{position:absolute}
.grid{inset:0;background-image:linear-gradient(rgba(124,192,255,.07) 2px,transparent 2px),linear-gradient(90deg,rgba(124,192,255,.07) 2px,transparent 2px);background-size:90px 90px}
.vig{inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(4,14,38,.45))}
.tape{left:-40px;top:96px;width:1160px;height:84px;background:var(--red);transform:rotate(-3deg);display:flex;align-items:center;gap:40px;padding-left:80px;
  font:700 30px SM;letter-spacing:.18em;color:var(--paper);white-space:nowrap;box-shadow:0 10px 0 rgba(4,14,38,.15)}
.tape b{font-family:LG;font-weight:400;font-size:58px;letter-spacing:.04em}
.brand{right:56px;top:212px;font:700 26px SM;letter-spacing:.06em}
.brand i{font-style:normal;color:var(--red)}
.head{left:64px;top:262px;font-family:LG;font-size:200px;line-height:.84;text-transform:uppercase;letter-spacing:.005em}
.head span{color:var(--red)}
.under{left:70px;top:612px;width:900px;height:20px;background:var(--red);transform:rotate(-1.2deg)}
.pol{background:#fff;padding:22px 22px 70px;box-shadow:8px 14px 0 rgba(4,14,38,.18),0 0 0 3px var(--ink);}
.pol .cap{position:absolute;left:0;right:0;bottom:16px;text-align:center;font:700 26px SM;letter-spacing:.04em}
.tp{width:150px;height:46px;background:rgba(124,192,255,.55);position:absolute}
.stamp{font-family:LG;font-size:118px;line-height:1;color:var(--red);border:10px solid var(--red);padding:10px 30px 0;border-radius:14px;letter-spacing:.04em;
  mix-blend-mode:multiply;opacity:.92}
.capbox{left:0;right:0;top:1440px;text-align:center;font-family:AB;font-size:92px;line-height:1.02;letter-spacing:-.01em;text-transform:uppercase}
.capbox .k{background:var(--red);color:var(--paper);padding:0 18px;display:inline-block;transform:rotate(-2deg)}
.handle{left:0;right:0;top:1700px;text-align:center;font:700 28px SM;letter-spacing:.08em;color:var(--red)}
html,body{background:#0B1F4A url(bg.jpg) center/cover no-repeat}
.grid{opacity:0}
.head{color:#fff;text-shadow:0 6px 28px rgba(4,14,38,.45)}
.head span{color:#9FD3FF;text-shadow:0 5px 0 #0B1F4A}
.under{background:#EAF3FF}
.tape{background:#0B1F4A;color:#9FD3FF}.tape b{color:#fff}
.brand{color:#fff}.brand i{color:#9FD3FF}
.pol{background:rgba(234,243,255,.14);box-shadow:0 30px 60px rgba(4,14,38,.45),0 0 0 2px rgba(234,243,255,.55);backdrop-filter:blur(14px);border-radius:22px}
.pol .cap{color:#EAF3FF}
.stamp{color:#EAF3FF;border-color:#EAF3FF;background:rgba(11,31,74,.55);mix-blend-mode:normal;opacity:1}
.capbox{color:#fff;text-shadow:0 6px 24px rgba(4,14,38,.55)}
.capbox .k{background:#EAF3FF;color:#0B1F4A;text-shadow:none}
.handle{color:#EAF3FF}
